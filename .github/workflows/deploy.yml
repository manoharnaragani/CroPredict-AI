name: Deploy & Validate CroPredict AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Unit Tests (CNN-BiGRU, PSO-NSPSO, SHC, LGD)
        run: npx tsx --test src/utils/*.test.ts

      - name: Build Webpack/Vite Distribution
        run: npm run build

      - name: Start local test server
        run: |
          npm run dev &
          DEV_PID=$!
          echo "Waiting for server to become ready on port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/models/status > /dev/null; then
              echo "Server ready after $i attempts."
              break
            fi
            sleep 1
          done

      - name: Verify API Deployment Endpoints (Bypass Browser Fallback)
        run: ./scripts/verify_deployment.sh http://localhost:3000
